# Original YOLOv5n v7.0 backbone/neck + shared 4-color/9-class/4-point head.
# Same data, optimizer and losses as the YOLOv8n empty10 experiment.
model: yolov5n-armor-pose
data: /workspace/datasets/armor_pose_custom_empty10/data.yaml
output: /workspace/runs/armor_pose_custom/yolov5n_empty10
backbone_weights: /workspace/weights/yolov5n.pt
from_scratch: false
input_size:
- 480
- 640
device: '0'
epochs: 100
batch: 8
workers: 2
cpu_threads: 2
seed: 42
amp: false
lr: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3
gradient_clip: 10.0
patience: 20
brightness: 0.15
val_conf: 0.001
nms_iou: 0.5
max_det: 300
log_interval: 50
max_train_images: 0
max_val_images: 0
loss:
  topk: 9
  color_weight: 1.0
  class_weight: 1.0
  keypoint_weight: 5.0
  box_weight: 1.0
  background_weight: 1.0
